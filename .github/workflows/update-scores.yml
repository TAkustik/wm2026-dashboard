name: Spielergebnisse aktualisieren

on:
  schedule:
    # Alle 5 Minuten — Minimum was GitHub Actions erlaubt
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ergebnisse abrufen
        run: node scripts/fetch-scores.js

      - name: Änderungen committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/matches.js scores.json
          git diff --staged --quiet || git commit -m "Scores $(date -u '+%H:%M') UTC"

      - name: Push
        run: git push