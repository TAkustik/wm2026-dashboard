name: Spielergebnisse aktualisieren

on:
  schedule:
    # Alle 5 Minuten — Minimum was GitHub Actions erlaubt
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ergebnisse abrufen
        run: node scripts/fetch-scores.js

      - name: Änderungen committen und pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.json
          if git diff --staged --quiet; then
            # Kein Score-Update — trotzdem committen um GitHub-Drosselung zu verhindern
            git commit --allow-empty -m "keep-alive $(date -u '+%H:%M') UTC"
          else
            git commit -m "Scores $(date -u '+%H:%M') UTC"
          fi
          git push